services:

  backend:
    build: .

    container_name: pinokio-backend

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      SPREADSHEET_ID: ${SPREADSHEET_ID}

    ports:
      - "8000:8000"

    restart: unless-stopped

    # розкоментуй коли переключишся на локальний postgres
    # depends_on:
    #   - db


  db:
    image: postgres:17

    container_name: pinokio-db

    profiles:
      - local-db

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


volumes:
  postgres_data: