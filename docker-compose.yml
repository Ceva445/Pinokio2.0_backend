services:

  backend:
    build: .

    container_name: pinokio-backend

    # всі змінні (POSTGRES_*, SMTP_*, SPREADSHEET_ID) беруться з .env
    env_file:
      - .env

    volumes:
      - ./creds.json:/app/creds.json:ro
      # Бінарники прошивок (OTA) — щоб переживали ребілд/перестворення контейнера
      - firmware_data:/app/firmware_store

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:17

    container_name: pinokio-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # розкоментуй, якщо треба підключатись до БД ззовні (наприклад з Windows)
    # ports:
    #   - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres_data:
  firmware_data:
