{% extends "admin/base_admin.html" %}
{% block admin_content %}

<h2>Rejestracje</h2>

<div class="tx-filters">
    <label>
        Pracownik
        <input id="transactionEmployeeSearch" placeholder="Login, imię lub nazwisko">
    </label>

    <label>
        Urządzenie
        <input id="transactionDeviceSearch" placeholder="Nazwa urządzenia">
    </label>

    <label>
        Od (data i godzina)
        <input id="transactionDateFrom" type="datetime-local">
    </label>

    <label>
        Do (data i godzina)
        <input id="transactionDateTo" type="datetime-local">
        <small>Godzina 00:00 = cały ten dzień</small>
    </label>

    <label>
        Typ operacji
        <select id="transactionType">
            <option value="">Wszystkie typy</option>
            <option value="registered">Rejestracja (wydanie)</option>
            <option value="unregistered">Wyrejestrowanie (zwrot)</option>
        </select>
    </label>

    <button type="button" id="transactionFiltersReset" class="btn">Wyczyść filtry</button>
</div>

<table id="transactionsTable">
    <thead>
        <tr>
            <th>Data / czas</th>
            <th>Typ</th>
            <th>Pracownik</th>
            <th>Urządzenie</th>
            <th>Manager</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div
    id="transactionsPagination"
    style="margin-top:10px"
></div>

<script src="{{ url_for('static', path='js/admin/admin.js') }}"></script>
{% endblock %}
