<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESP32 Live Monitor{% endblock %}</title>
    {% block styles %}{% endblock %}
</head>
<body>

<header style="display:flex; justify-content:flex-end; margin-bottom:20px; gap:10px;">
    <!-- стара кнопка монітора прихована; використовується Monitor V2
    <a href="/monitor" id="monitorBtn" style="display:none;">📊 ESP32 Real-time Monitor</a>
    -->
    <a href="/monitor2" id="monitor2Btn" style="display:none;">📈 ESP32 Monitor V2</a>

    <a href="/" id="homeBtn" style="display:none;">Do strony głównej</a>
    <a href="/admin" id="adminBtn" style="display:none;">Panel administracyjny</a>
    <a href="/manager" id="managerBtn" style="display:none;">Panel Administratora</a>
    <a href="/login" id="loginBtn">Zaloguj się</a>
    <a href="#" id="logoutBtn" class="button-link" style="display:none;">Wyloguj się</a>
</header>

{% block content %}{% endblock %}

<script>
async function checkAuth() {
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminBtn = document.getElementById("adminBtn");
    const managerBtn = document.getElementById("managerBtn");
    const homeBtn  = document.getElementById("homeBtn");
    const monitorBtn = document.getElementById("monitorBtn");
    const monitor2Btn = document.getElementById("monitor2Btn");

    const isAdminPage = window.location.pathname.startsWith("/admin");
    const isManagerPage = window.location.pathname.startsWith("/manager");

    const res = await fetch("/auth/me", {
        credentials: "include"
    });

    if (!res.ok) {
        // ❌ не залогінений
        document.body.classList.add("guest");
        document.body.classList.remove("auth");

        loginBtn.style.display = "inline";
        logoutBtn.style.display = "none";
        adminBtn.style.display = "none";
        managerBtn.style.display = "none";
        homeBtn.style.display = "none";
        if (monitorBtn) monitorBtn.style.display = "none";
        if (monitor2Btn) monitor2Btn.style.display = "none";
        return;
    }

    const user = await res.json();

    // Wymuszona zmiana hasła: dopóki flaga jest ustawiona, użytkownik
    // trafia na ekran zmiany hasła z każdej innej strony.
    if (user.must_change_password && !location.pathname.startsWith("/change-password")) {
        location.href = "/change-password";
        return;
    }

    // ✔ залогінений
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline";

    // Спостерігач сприяту не видає, тож монітор йому і не показуємо —
    // сервер його туди все одно не пустить (403), а мертве посилання
    // виглядає як поломка.
    const isObserver = user.role === "observer";
    if (monitorBtn) monitorBtn.style.display = isObserver ? "none" : "inline";
    if (monitor2Btn) monitor2Btn.style.display = isObserver ? "none" : "inline";

    if (user.role === "admin" || isObserver) {
        if (isAdminPage) {
            // 🟢 адмін/спостерігач у панелі → показати "На головну"
            adminBtn.style.display = "none";
            managerBtn.style.display = "none";
            homeBtn.style.display = "inline";
        } else {
            // 🟢 адмін/спостерігач поза панеллю → показати вхід у панель
            adminBtn.style.display = "inline";
            managerBtn.style.display = "none";
            homeBtn.style.display = "none";
        }
    } else if (user.role === "manager") {
        if (isManagerPage) {
            // 🟢 керівник в панелі керівника → показати "На головну"
            managerBtn.style.display = "none";
            adminBtn.style.display = "none";
            homeBtn.style.display = "inline";
        } else {
            // 🟢 керівник не в панелі керівника → показати "Панель керівника"
            managerBtn.style.display = "inline";
            adminBtn.style.display = "none";
            homeBtn.style.display = "none";
        }
    } else {
        // 👤 не адмін і не керівник
        adminBtn.style.display = "none";
        managerBtn.style.display = "none";
        homeBtn.style.display = "none";
    }
}

document.getElementById("logoutBtn")?.addEventListener("click", async () => {
    const res = await fetch("/auth/logout", {
        method: "POST",
        credentials: "include"
    });

    if (res.ok) {
        window.location.href = "/";
    } else {
        alert("Nie udało się wylogować");
    }
});

checkAuth();

/**
 * Pilnowanie sesji na ekranach bez monitora.
 *
 * Zakładka monitora dostaje po WebSocket wiadomość "force_logout" i sama idzie
 * na logowanie. Reszta paneli takiego kanału nie ma, więc po wyrzuceniu przez
 * administratora człowiek zostawał na obrazku sprzed chwili — sesja martwa,
 * ekran ten sam, dopóki czegoś nie kliknął.
 *
 * Pytamy więc o siebie co pół minuty i przy pierwszej odmowie idziemy tam,
 * gdzie i tak trzeba trafić.
 */
const SESSION_CHECK_MS = 30000;

setInterval(async () => {
    // Ekran logowania nie ma czego pilnować, a monitor robi to po swojemu.
    if (location.pathname.startsWith("/login")) return;

    try {
        const res = await fetch("/auth/me", {
            credentials: "include",
            headers: { "X-Requested-With": "XMLHttpRequest" }
        });

        if (res.status === 401) {
            location.href = "/login?reason=expired";
        }
    } catch (err) {
        // Zerwana sieć to nie wylogowanie — przy następnej próbie się okaże.
    }
}, SESSION_CHECK_MS);
</script>


{% block body_scripts %}{% endblock %}
</body>
</html>
