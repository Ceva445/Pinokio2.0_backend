{% extends "base.html" %}

{% block title %}Zmiana hasła{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/monitor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-container">
    <form id="changePasswordForm" class="login-form">
        <h2>USTAW NOWE HASŁO</h2>
        <div class="login-notice" style="display:block;">
            Logujesz się po raz pierwszy. Ustaw własne hasło, aby kontynuować.
        </div>
        <input name="new_password" type="password" placeholder="Nowe hasło" required>
        <input name="confirm_password" type="password" placeholder="Powtórz hasło" required>
        <button type="submit">Zapisz hasło</button>
    </form>
</div>
{% endblock %}

{% block body_scripts %}
    <script src="{{ url_for('static', path='js/change_password.js') }}"></script>
{% endblock %}
