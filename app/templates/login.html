{% extends "base.html" %}

{% block title %}Вхід в систему{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/monitor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-container">
    <form id="loginForm" class="login-form">
        <h2>LOGOWANIE</h2>
        <div id="loginNotice" class="login-notice" style="display:none;"></div>
        <input name="username" placeholder="Login" required>
        <input name="password" type="password" placeholder="Hasło" required>
        <select name="device_id" id="deviceSelect">
            <option value="">— (admin) bez urządzenia —</option>
        </select>
        <button type="submit">Zaloguj się</button>
        <a href="/" class="login-back">← Powrót</a>
    </form>
</div>
{% endblock %}

{% block body_scripts %}
    <script src="{{ url_for('static', path='js/login.js') }}"></script>
{% endblock %}
